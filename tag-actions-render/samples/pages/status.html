<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Status Board</title>
<style>
  body { margin: 0; padding: 32px; font-family: Helvetica, Arial, sans-serif; background: #f4f6fb; color: #1c2330; }
  h1 { margin: 0 0 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
  .card { background: #fff; border-radius: 12px; padding: 18px; box-shadow: 0 4px 16px rgba(0,0,0,.06); }
  .name { font-size: 13px; color: #6a7385; }
  .value { font-size: 28px; font-weight: 700; margin-top: 6px; }
  .up { color: #1f8a4c; }
  .down { color: #c23b32; }
  button { margin-top: 20px; padding: 10px 16px; border: 0; border-radius: 8px; background: #2f6fde; color: #fff; font-size: 14px; cursor: pointer; }
</style>
</head>
<body>
<h1>Status Board</h1>
<div class="grid" id="grid"></div>
<button id="refresh">Run checks</button>
<script>
  const services = ["api", "auth", "search", "billing"];
  function render() {
    document.getElementById("grid").innerHTML = services.map((name) => {
      const up = Math.random() > 0.2;
      const latency = Math.round(20 + Math.random() * 80);
      return '<div class="card"><div class="name">' + name + '</div><div class="value ' + (up ? "up" : "down") + '">' + (up ? latency + " ms" : "DOWN") + "</div></div>";
    }).join("");
  }
  document.getElementById("refresh").addEventListener("click", render);
  render();
</script>
</body>
</html>
