name: temp-render
run-name: temp-render pr-${{ inputs.pr || github.event.pull_request.number }} ${{ inputs.nonce || github.event.action }}

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: number
      nonce:
        description: Run id picked by scripts/render-pr.sh
        required: true
        type: string
  pull_request:
    types: [unlabeled, closed]

concurrency:
  group: temp-render-pages
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  LABEL: temp-render
  HOURS: "24"
  TOOL: tag-actions-render
  PREVIEW: pr-${{ inputs.pr || github.event.pull_request.number }}
  PR_NUMBER: ${{ inputs.pr || github.event.pull_request.number }}
  GH_TOKEN: ${{ github.token }}

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Resolve pull request
        run: |
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "invalid pull request number: $PR_NUMBER" >&2; exit 1; }
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            --jq '[.head.sha, .base.sha, (.head.repo.full_name // "none"), .state] | @tsv')"
          read -r head base repo state <<< "$pr"
          [ "$repo" = "$GITHUB_REPOSITORY" ] || { echo "pull request branch is not in this repo: $repo" >&2; exit 1; }
          [ "$state" = "open" ] || { echo "pull request is $state" >&2; exit 1; }
          echo "HEAD_SHA=$head" >> "$GITHUB_ENV"
          echo "BASE_SHA=$base" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Test renderer
        run: node --test "$TOOL/tests/*.test.js"

      - name: List html and md files of the pull request
        run: |
          git diff -z --name-only --diff-filter=d "$BASE_SHA...$HEAD_SHA" -- '*.md' '*.markdown' '*.html' '*.htm' > "$RUNNER_TEMP/files"
          count="$(tr -cd '\0' < "$RUNNER_TEMP/files" | wc -c | tr -d ' ')"
          echo "FILE_COUNT=$count" >> "$GITHUB_ENV"
          echo "found $count files"

      - name: Build encrypted page
        if: env.FILE_COUNT != '0'
        env:
          RENDER_PASS: ${{ secrets.RENDER_PASS }}
        run: |
          [ -n "$RENDER_PASS" ] || { echo "RENDER_PASS secret is not set" >&2; exit 1; }
          node "$TOOL/src/build.js" --root . --out "$RUNNER_TEMP/site" \
            --user "$PREVIEW" --pass "$RENDER_PASS" --hours "$HOURS" \
            --title "PR #$PR_NUMBER" --files-from "$RUNNER_TEMP/files"

      - name: Publish to gh-pages
        if: env.FILE_COUNT != '0'
        run: bash "$TOOL/ci/pages.sh" publish "$PREVIEW" "$RUNNER_TEMP/site"

      - name: Comment credentials on the pull request
        run: |
          if [ "$FILE_COUNT" = "0" ]; then
            printf '### temp-render\nNo html or md files changed in this pull request.\n' > "$RUNNER_TEMP/body"
          else
            owner="$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')"
            url="https://$owner.github.io/${GITHUB_REPOSITORY#*/}/previews/$PREVIEW/"
            expires="$(date -u -d "@$(cat "$RUNNER_TEMP/site/expires-at")" '+%Y-%m-%d %H:%M UTC')"
            {
              echo "### temp-render preview"
              echo ""
              echo "| | |"
              echo "|---|---|"
              echo "| Page | $url |"
              echo "| User | \`$PREVIEW\` |"
              echo "| Password | printed only in the terminal that ran scripts/render-pr.sh |"
              echo "| Files | $FILE_COUNT |"
              echo "| Expires | $expires |"
              echo ""
              echo "Pushes do not publish, run scripts/render-pr.sh again for a new page and a new password."
            } > "$RUNNER_TEMP/body"
          fi
          bash "$TOOL/ci/comment.sh" "$RUNNER_TEMP/body"

  remove:
    if: >-
      (github.event.action == 'closed' && contains(github.event.pull_request.labels.*.name, 'temp-render')) ||
      (github.event.action == 'unlabeled' && github.event.label.name == 'temp-render')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Remove preview from gh-pages
        run: bash "$TOOL/ci/pages.sh" remove "$PREVIEW"

      - name: Update comment
        run: |
          printf '### temp-render\nPreview removed.\n' > "$RUNNER_TEMP/body"
          bash "$TOOL/ci/comment.sh" "$RUNNER_TEMP/body"
